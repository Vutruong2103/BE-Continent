spring.application.name=continent
server.port=8080

# ========================
# LIQUIBASE
# ========================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/changelog-master.yml
spring.liquibase.clear-checksums=true

spring.main.allow-bean-definition-overriding=true

# ========================
# DATASOURCE (MariaDB)
# ========================
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/continent?serverTimezone=UTC&createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=mariadb@123

# ========================
# JPA / HIBERNATE
# ========================
spring.data.jpa.repositories.bootstrap-mode=deferred

spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.proc.param_null_passing=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
#spring.jpa.properties.hibernate.cache.use_second_level_cache=true
#spring.jpa.properties.hibernate.cache.use_query_cache=true
#spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.ehcache.EhCacheRegionFactory
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.search.backend.directory.root=${HOME}/project-data/continent-index
spring.jpa.properties.hibernate.search.enabled=FALSE
spring.jpa.properties.hibernate.show_sql=TRUE

# ========================
# SECURITY (JWT)
# ========================
security.jwt.secret=change-me-to-256bit-secret-change-me-change-me-please-please
security.jwt.expiration-ms=86400000

# ========================
# I18N (messages)
# ========================
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.jpa.hibernate.ddl-auto=none