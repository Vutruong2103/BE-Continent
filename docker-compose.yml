version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: mariadb-container
    environment:
      MARIADB_ROOT_PASSWORD: mariadb@123
      MARIADB_DATABASE: continent
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - my-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.1
    container_name: keycloak-container
    command:
      - "start-dev"
    environment:
      KC_DB: mariadb
      # Sử dụng URL đầy đủ để Keycloak có thể tự tạo DB
      KC_DB_URL: jdbc:mariadb://mariadb:3306/keycloak_db?createDatabaseIfNotExist=true
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: mariadb@123
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME: 'localhost'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    depends_on:
      - mariadb
    networks:
      - my-network
    restart: unless-stopped

volumes:
  mariadb-data:

networks:
  my-network:
